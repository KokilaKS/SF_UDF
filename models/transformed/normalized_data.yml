version: 2

models:
  - name: normalized_data
    description: "Final normalized data using smart_date Snowflake UDF"
    columns:
      - name: normalized_date
        description: "Date normalized using Snowflake smart_date UDF"
        tests:
          - not_null:
              where: "input_date IS NOT NULL AND input_date <> 'invalid_date'"
